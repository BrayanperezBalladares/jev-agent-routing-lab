<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jev Agent Routing Lab — Empirical research dashboard analyzing semantic routing accuracy, decision boundary stability, and confidence margins in multi-agent routing architectures." />
    <title>Jev Agent Routing Lab — Semantic Routing &amp; Boundary Analysis</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('jev_theme_preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = 'light';
          if (stored === 'dark') {
            theme = 'dark';
          } else if (stored === 'light') {
            theme = 'light';
          } else if (prefersDark) {
            theme = 'dark';
          } else {
            theme = 'light';
          }
          document.documentElement.dataset.theme = theme;
          var storedLocale = localStorage.getItem('jev_locale');
          if (storedLocale) {
            document.documentElement.lang = storedLocale;
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
